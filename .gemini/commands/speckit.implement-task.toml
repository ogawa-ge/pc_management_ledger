description = "Implement SPECIFIC tasks by providing their Task IDs as arguments."

prompt = """
---
description: Implement ONLY the specifically requested tasks from tasks.md.
---

## User Input
```text
$ARGUMENTS
```

## Critical Execution Rules
1. **REQUIREMENT**: You MUST check the User Input ($ARGUMENTS). If the user did not provide any specific Task IDs, you MUST STOP immediately and ask the user to provide Task IDs (e.g., `/speckit.implement-task Task-1`).
2. **STRICT ISOLATION**: Implement ONLY the Task IDs specified in the user input. Do NOT automatically proceed to the next incomplete task.

## Outline

1. **Context Loading**: 
   - Read `tasks.md`. Find the specific tasks matching the IDs provided in the User Input.
   - Read ONLY the files directly related to these specific tasks.

2. **Execute Implementation**:
   - Write or update the code for the requested tasks only.
   - Run or write tests if applicable to the task.

3. **Progress Tracking (MANDATORY)**:
   - Upon successful implementation, you MUST update `tasks.md`.
   - Find the exact line for the completed task and change the unchecked box `- [ ]` to a checked box `- [x]`. Save the file.

4. **Completion & HALT**:
   - Summarize what was implemented.
   - **STOP EXECUTION.** Do NOT start or suggest starting the next task on your own. Wait for the user's next command.
"""